name: Combined IMAP PR 182 + 186 verification
on:
  push:
    branches: [test/imap-session-plus-fallback-186]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Placeholder bundled model
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          touch src-tauri/resources/model.gguf
      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: IMAP session and real TLS regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features imap_session -- --nocapture
      - name: TLS timeout handshake regression
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features tls_timeout_fallback -- --nocapture
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --tests -- -D warnings
